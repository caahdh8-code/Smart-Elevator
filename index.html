<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Elevator</title>

  <!-- Firebase Compat Version -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;

      background: #d9dde0;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      color: #26313a;
    }


    /* =========================
       MAIN CONTAINER
       ========================= */

    .container {

      width: 100%;
      max-width: 520px;

      min-height: 720px;

      background: #b9bec2;

      border-radius: 20px;

      padding: 45px 25px;

      text-align: center;

      box-shadow: 0 10px 30px rgba(0,0,0,0.18);

    }


    /* =========================
       LIFT IMAGE / GRAPHIC
       ========================= */

    .lift {

      width: 150px;
      height: 150px;

      border: 8px solid #384149;

      background: #cbd0d4;

      margin: 0 auto 35px;

      position: relative;

      border-radius: 6px;

      box-shadow:
        inset 0 0 0 5px #9da4aa;

    }


    .door-left {

      position: absolute;

      left: 0;
      top: 0;

      width: 50%;
      height: 100%;

      background: #c4c9cd;

      border-right: 4px solid #384149;

    }


    .door-right {

      position: absolute;

      right: 0;
      top: 0;

      width: 50%;
      height: 100%;

      background: #c4c9cd;

      border-left: 4px solid #384149;

    }


    /* =========================
       SMALL LIFT BUTTON
       ========================= */

    .lift-control {

      position: absolute;

      right: -38px;
      top: 35px;

      width: 28px;
      height: 65px;

      background: #384149;

      border-radius: 5px;

      display: flex;

      flex-direction: column;

      justify-content: space-around;

      align-items: center;

    }


    .arrow-up {

      width: 0;
      height: 0;

      border-left: 7px solid transparent;
      border-right: 7px solid transparent;

      border-bottom: 10px solid white;

    }


    .arrow-down {

      width: 0;
      height: 0;

      border-left: 7px solid transparent;
      border-right: 7px solid transparent;

      border-top: 10px solid white;

    }


    /* =========================
       TITLE
       ========================= */

    h1 {

      font-size: 34px;

      line-height: 1.2;

      margin-bottom: 10px;

      color: #26313a;

    }


    .subtitle {

      font-size: 18px;

      color: #4d5961;

      margin-bottom: 45px;

    }


    /* =========================
       FLOOR BUTTONS
       ========================= */

    .floor-buttons {

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 15px;

      width: 100%;

    }


    .floor-button {

      width: 120px;
      height: 120px;

      border: none;

      border-radius: 15px;

      background: #cbd0d4;

      color: #26313a;

      font-size: 42px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 6px 12px rgba(0,0,0,0.15);

      transition: 0.15s;

    }


    .floor-button:hover {

      background: #d5d9dc;

      transform: translateY(-2px);

    }


    .floor-button:active {

      transform: scale(0.95);

    }


    /* =========================
       HIDE PAGE
       ========================= */

    .hidden {

      display: none !important;

    }


    /* =========================
       WARNING
       ========================= */

    #warning {

      margin-top: 25px;

      min-height: 25px;

      color: #c62828;

      font-size: 18px;

      font-weight: bold;

    }


    /* =========================
       FINAL PAGE
       ========================= */

    #finalPage {

      display: none;

      min-height: 600px;

      justify-content: center;

      align-items: center;

    }


    #finalPage h2 {

      font-size: 40px;

      line-height: 1.2;

    }


    #finalStatus {

      margin-top: 20px;

      font-size: 17px;

      color: #56616a;

    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 430px) {

      .container {

        min-height: 90vh;

        padding: 35px 18px;

      }


      .lift {

        width: 125px;
        height: 125px;

      }


      h1 {

        font-size: 28px;

      }


      .subtitle {

        font-size: 16px;

      }


      .floor-buttons {

        gap: 10px;

      }


      .floor-button {

        width: 95px;
        height: 95px;

        font-size: 34px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <!-- =================================================
       PAGE 1
       CURRENT FLOOR
       ================================================= -->

  <div id="currentPage">


    <!-- Lift Graphic -->

    <div class="lift">

      <div class="door-left"></div>

      <div class="door-right"></div>

      <div class="lift-control">

        <div class="arrow-up"></div>

        <div class="arrow-down"></div>

      </div>

    </div>


    <h1>

      Select Your Current Floor

    </h1>


    <div class="subtitle">

      (Pilih lantai anda terkini)

    </div>


    <!-- Buttons 1 2 3 -->

    <div class="floor-buttons">

      <button
        class="floor-button"
        onclick="selectCurrentFloor(1)">
        1
      </button>


      <button
        class="floor-button"
        onclick="selectCurrentFloor(2)">
        2
      </button>


      <button
        class="floor-button"
        onclick="selectCurrentFloor(3)">
        3
      </button>

    </div>


  </div>



  <!-- =================================================
       PAGE 2
       DESTINATION FLOOR
       ================================================= -->

  <div
    id="destinationPage"
    class="hidden"
  >


    <!-- Lift Graphic -->

    <div class="lift">

      <div class="door-left"></div>

      <div class="door-right"></div>

      <div class="lift-control">

        <div class="arrow-up"></div>

        <div class="arrow-down"></div>

      </div>

    </div>


    <h1>

      Select Your Destination Floor

    </h1>


    <div class="subtitle">

      (Pilih anda ingin ke lantai berapa)

    </div>


    <!-- Buttons 1 2 3 -->

    <div class="floor-buttons">

      <button
        class="floor-button"
        onclick="selectDestinationFloor(1)">
        1
      </button>


      <button
        class="floor-button"
        onclick="selectDestinationFloor(2)">
        2
      </button>


      <button
        class="floor-button"
        onclick="selectDestinationFloor(3)">
        3
      </button>

    </div>


    <!-- Warning -->

    <div id="warning"></div>


  </div>



  <!-- =================================================
       FINAL PAGE
       ================================================= -->

  <div id="finalPage">

    <div>

      <h2>

        Go to your destination...

      </h2>


      <div id="finalStatus"></div>

    </div>

  </div>


</div>



<script>


/* =====================================================
   FIREBASE
   ===================================================== */


var firebaseConfig = {

  apiKey:
    "AIzaSyBCFpNma5QPo0iQEHpVpHQ04Kk_Ki5M1q8",

  databaseURL:
    "https://smart-elevator-8be27-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "smart-lift-touchless"

};


firebase.initializeApp(firebaseConfig);


var database =
  firebase.database();



/* =====================================================
   VARIABLE CURRENT FLOOR
   ===================================================== */


var currentFloor = null;



/* =====================================================
   PAGE 1
   SELECT CURRENT FLOOR
   ===================================================== */


function selectCurrentFloor(floor) {


  // Simpan current floor

  currentFloor = Number(floor);


  console.log(
    "Current Floor Selected:",
    currentFloor
  );


  /*
    TERUS TUKAR PAGE

    Page Current Floor hilang
    Page Destination Floor muncul
  */


  document
    .getElementById("currentPage")
    .classList
    .add("hidden");


  document
    .getElementById("destinationPage")
    .classList
    .remove("hidden");


  // Kosongkan warning

  document
    .getElementById("warning")
    .innerText = "";


}



/* =====================================================
   PAGE 2
   SELECT DESTINATION FLOOR
   ===================================================== */


function selectDestinationFloor(destination) {


  destination =
    Number(destination);


  console.log(
    "Destination:",
    destination
  );


  /* ==========================================
     CHECK SAME FLOOR
     ========================================== */


  if (
    destination === currentFloor
  ) {


    document
      .getElementById("warning")
      .innerText =
      "You are already at this floor";


    return;

  }



  /* ==========================================
     DETERMINE DIRECTION
     ========================================== */


  var status;


  if (
    destination > currentFloor
  ) {

    status = "NAIK";

  }

  else {

    status = "TURUN";

  }



  /* ==========================================
     SHOW FINAL PAGE
     ========================================== */


  document
    .getElementById("destinationPage")
    .classList
    .add("hidden");


  document
    .getElementById("finalPage")
    .style
    .display = "flex";


  document
    .getElementById("finalStatus")
    .innerText =
      "Floor " +
      currentFloor +
      " → Floor " +
      destination;



  /* ==========================================
     SEND FIREBASE
     ========================================== */


  sendToFirebase(
    currentFloor,
    destination,
    status
  );


}



/* =====================================================
   SEND DATA TO FIREBASE
   ===================================================== */


function sendToFirebase(
  current,
  destination,
  status
) {


  var data = {


    currentFloor:
      Number(current),


    destinationFloor:
      Number(destination),


    status:
      String(status)


  };


  console.log(
    "Sending Firebase:",
    data
  );


  database
    .ref("command")
    .set(data)


    .then(function() {


      console.log(
        "Firebase updated successfully"
      );


    })


    .catch(function(error) {


      console.error(
        "Firebase Error:",
        error
      );


    });


}


</script>


</body>

</html>
