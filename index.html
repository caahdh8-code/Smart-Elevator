<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Elevator</title>

  <!-- Firebase Compat / Classic -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #d9dde0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #27313a;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 700px;

      background: #b9bec2;

      border-radius: 22px;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.18);

      padding: 40px 25px;

      text-align: center;
    }

    /* =========================
       LIFT ICON
       ========================= */

    .lift {
      width: 150px;
      height: 150px;

      border: 8px solid #384149;

      background: #cbd0d4;

      border-radius: 8px;

      margin: 0 auto 35px;

      position: relative;

      box-shadow:
        inset 0 0 0 5px #9da4aa;
    }

    .door-left,
    .door-right {
      position: absolute;

      top: 0;

      width: 50%;
      height: 100%;

      background: #c3c8cc;
    }

    .door-left {
      left: 0;

      border-right: 4px solid #384149;
    }

    .door-right {
      right: 0;

      border-left: 4px solid #384149;
    }

    /* Lift buttons */

    .lift-buttons {
      position: absolute;

      right: -38px;
      top: 35px;

      width: 28px;
      height: 65px;

      background: #384149;

      border-radius: 5px;

      display: flex;
      flex-direction: column;

      justify-content: space-around;
      align-items: center;
    }

    .arrow-up {
      width: 0;
      height: 0;

      border-left: 7px solid transparent;
      border-right: 7px solid transparent;

      border-bottom: 10px solid white;
    }

    .arrow-down {
      width: 0;
      height: 0;

      border-left: 7px solid transparent;
      border-right: 7px solid transparent;

      border-top: 10px solid white;
    }

    /* =========================
       TITLE
       ========================= */

    h1 {
      font-size: 34px;

      line-height: 1.2;

      margin-bottom: 10px;

      color: #263039;
    }

    .subtitle {
      font-size: 18px;

      color: #4e5961;

      margin-bottom: 45px;
    }

    /* =========================
       FLOOR BUTTONS
       ========================= */

    .floor-buttons {
      display: flex;

      flex-direction: row;

      justify-content: center;

      gap: 15px;

      width: 100%;
    }

    .floor-btn {
      width: 120px;
      height: 120px;

      border: none;

      border-radius: 15px;

      background: #cbd0d4;

      color: #27313a;

      font-size: 42px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 6px 12px rgba(0,0,0,0.15);

      transition: 0.15s;
    }

    .floor-btn:hover {
      background: #d5d9dc;

      transform: translateY(-2px);
    }

    .floor-btn:active {
      transform: scale(0.95);
    }

    /* =========================
       WARNING
       ========================= */

    #warning {
      margin-top: 25px;

      min-height: 25px;

      color: #c62828;

      font-size: 18px;

      font-weight: bold;
    }

    /* =========================
       PAGE 2
       ========================= */

    .hidden {
      display: none !important;
    }

    /* =========================
       FINAL PAGE
       ========================= */

    #finalPage {
      display: none;

      min-height: 620px;

      align-items: center;

      justify-content: center;
    }

    #finalPage h2 {
      font-size: 42px;

      line-height: 1.2;

      color: #27313a;
    }

    #finalStatus {
      margin-top: 20px;

      font-size: 17px;

      color: #56616a;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 430px) {

      .app {
        min-height: 90vh;

        padding: 35px 18px;
      }

      .lift {
        width: 125px;
        height: 125px;

        margin-bottom: 30px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 16px;

        margin-bottom: 35px;
      }

      .floor-buttons {
        gap: 10px;
      }

      .floor-btn {
        width: 95px;
        height: 95px;

        font-size: 34px;
      }

      #finalPage h2 {
        font-size: 34px;
      }
    }

  </style>
</head>

<body>

  <div class="app">

    <!-- =================================================
         PAGE 1
         CURRENT FLOOR
         ================================================= -->

    <div id="currentPage">

      <!-- Lift Graphic -->
      <div class="lift">

        <div class="door-left"></div>
        <div class="door-right"></div>

        <div class="lift-buttons">

          <div class="arrow-up"></div>

          <div class="arrow-down"></div>

        </div>

      </div>

      <h1>
        Select Your Current Floor
      </h1>

      <div class="subtitle">
        (Pilih lantai anda terkini)
      </div>

      <!-- Floor Buttons -->

      <div class="floor-buttons">

        <button
          class="floor-btn"
          onclick="selectCurrentFloor(1)">
          1
        </button>

        <button
          class="floor-btn"
          onclick="selectCurrentFloor(2)">
          2
        </button>

        <button
          class="floor-btn"
          onclick="selectCurrentFloor(3)">
          3
        </button>

      </div>

    </div>


    <!-- =================================================
         PAGE 2
         DESTINATION FLOOR
         ================================================= -->

    <div id="destinationPage" class="hidden">

      <!-- Lift Graphic -->

      <div class="lift">

        <div class="door-left"></div>
        <div class="door-right"></div>

        <div class="lift-buttons">

          <div class="arrow-up"></div>

          <div class="arrow-down"></div>

        </div>

      </div>


      <h1>
        Select Your Destination Floor
      </h1>

      <div class="subtitle">
        (Pilih anda ingin ke lantai berapa)
      </div>


      <!-- Destination Buttons -->

      <div class="floor-buttons">

        <button
          class="floor-btn"
          onclick="selectDestinationFloor(1)">
          1
        </button>

        <button
          class="floor-btn"
          onclick="selectDestinationFloor(2)">
          2
        </button>

        <button
          class="floor-btn"
          onclick="selectDestinationFloor(3)">
          3
        </button>

      </div>


      <!-- Same Floor Warning -->

      <div id="warning"></div>

    </div>


    <!-- =================================================
         FINAL PAGE
         ================================================= -->

    <div id="finalPage">

      <div>

        <h2>
          Go to your destination...
        </h2>

        <div id="finalStatus"></div>

      </div>

    </div>

  </div>


  <!-- =================================================
       JAVASCRIPT
       ================================================= -->

  <script>

    /* =================================================
       FIREBASE CONFIGURATION
       ================================================= */

    var firebaseConfig = {

      apiKey:
        "AIzaSyBCFpNma5QPo0iQEHpVpHQ04Kk_Ki5M1q8",

      authDomain:
        "smart-lift-touchless.firebaseapp.com",

      databaseURL:
        "https://smart-elevator-8be27-default-rtdb.asia-southeast1.firebasedatabase.app",

      projectId:
        "smart-lift-touchless"

    };


    /* Start Firebase */

    firebase.initializeApp(firebaseConfig);


    var database =
      firebase.database();


    /* =================================================
       VARIABLES
       ================================================= */

    var currentFloor = null;


    /* =================================================
       PAGE 1
       USER SELECT CURRENT FLOOR
       ================================================= */

    function selectCurrentFloor(floor) {

      currentFloor = Number(floor);

      console.log(
        "Current Floor:",
        currentFloor
      );


      /*
        Optimistic UI

        Page terus bertukar tanpa tunggu Firebase.
      */

      document
        .getElementById("currentPage")
        .classList
        .add("hidden");


      document
        .getElementById("destinationPage")
        .classList
        .remove("hidden");


      document
        .getElementById("warning")
        .innerText = "";

    }


    /* =================================================
       PAGE 2
       USER SELECT DESTINATION
       ================================================= */

    function selectDestinationFloor(destination) {

      destination = Number(destination);


      console.log(
        "Destination Floor:",
        destination
      );


      /* ===============================
         SAFETY CHECK
         =============================== */

      if (destination === currentFloor) {

        document
          .getElementById("warning")
          .innerText =
          "You are already at this floor";

        return;

      }


      /* ===============================
         DETERMINE DIRECTION
         =============================== */

      var status;


      if (destination > currentFloor) {

        status = "NAIK";

      }

      else {

        status = "TURUN";

      }


      console.log(
        "Status:",
        status
      );


      /* ===============================
         OPTIMISTIC UI
         =============================== */

      document
        .getElementById("destinationPage")
        .classList
        .add("hidden");


      document
        .getElementById("finalPage")
        .style
        .display = "flex";


      document
        .getElementById("finalStatus")
        .innerText =
        "Floor " +
        currentFloor +
        " → Floor " +
        destination;


      /* ===============================
         SEND TO FIREBASE
         =============================== */

      sendToFirebase(
        currentFloor,
        destination,
        status
      );

    }


    /* =================================================
       FIREBASE FUNCTION
       ================================================= */

    function sendToFirebase(
      current,
      target,
      status
    ) {

      var data = {

        CurrentFloor:
          Number(current),

        TargetFloor:
          Number(target),

        Status:
          String(status)

      };


      /*
        Firebase structure:

        command
          CurrentFloor: 1
          TargetFloor: 2
          Status: "NAIK"
      */

      database
        .ref("command")
        .set(data)

        .then(function() {

          console.log(
            "Firebase data sent successfully"
          );

          console.log(data);

        })

        .catch(function(error) {

          console.error(
            "Firebase error:",
            error
          );

        });

    }

  </script>

</body>
</html>
