<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Elevator System</title>
    
    <!-- SDK Firebase CDN Klasik (Wajib untuk kestabilan penuh di GitHub Pages) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        /* Reka bentuk tema satu warna minimalis kelabu (Slate Grey) mengikut gambar */
        body { font-family: 'Arial', sans-serif; text-align: center; background: #c2c2c2; color: #1a1a1a; margin: 0; padding-top: 50px; }
        .container { max-width: 450px; margin: auto; background: #dbdbdb; padding: 40px 20px; border-radius: 0px; min-height: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        /* Gaya Ikon Pintu Lif Mengikut Grafik Gambar */
        .lift-icon { width: 100px; height: 100px; border: 4px solid #1a1a1a; position: relative; margin-bottom: 25px; background: #dbdbdb; }
        .lift-icon::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #1a1a1a; transform: translateX(-50%); }
        .lift-arrow { position: absolute; right: -30px; top: 35px; width: 15px; height: 30px; border: 3px solid #1a1a1a; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 2px 0; box-sizing: border-box; }
        .lift-arrow::before { content: '▲'; font-size: 8px; line-height: 1; }
        .lift-arrow::after { content: '▼'; font-size: 8px; line-height: 1; }

        h2 { font-size: 28px; font-weight: bold; margin: 5px 0; color: #1a1a1a; text-transform: none; }
        p.sub-title { font-size: 16px; margin: 5px 0 35px 0; color: #404040; font-weight: 500; }
        
        /* Susunan Butang Melintang (Horizontal Row) Mengikut Gambar */
        .btn-row { display: flex; justify-content: center; gap: 15px; width: 100%; max-width: 360px; }
        
        /* Gaya Butang Petak Kelabu Segi Empat */
        .btn { padding: 20px 0; width: 100px; font-size: 32px; font-weight: bold; cursor: pointer; border-radius: 12px; border: none; background: #b8b8b8; color: #1a1a1a; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15), 0 4px 6px rgba(0,0,0,0.1); transition: 0.1s; }
        .btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15), 0 2px 3px rgba(0,0,0,0.1); }
        
        .status-box { font-size: 16px; margin-bottom: 20px; padding: 8px 20px; background: #a8a8a8; color: #1a1a1a; border-radius: 20px; font-weight: bold; }
        .hidden { display: none !important; }
        
        .message-success { font-size: 24px; font-weight: bold; color: #2e7d32; margin-top: 20px; }
        .message-alert { font-size: 16px; font-weight: bold; color: #c62828; margin-top: 20px; }
        
        .btn-back { background: transparent; border: 2px solid #404040; font-size: 14px; padding: 10px 20px; border-radius: 8px; cursor: pointer; margin-top: 30px; font-weight: bold; color: #404040; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- Grafik Ikon Lif Industri -->
    <div class="lift-icon">
        <div class="lift-arrow"></div>
    </div>
    
    <!-- Paparan Status Aras Semasa Lif Dari PLC -->
    <div id="lift-status" class="status-box">Status Lif: Tingkat <span id="current">0</span></div>
    
    <!-- HALAMAN 1: PILIH TINGKAT SEMASA -->
    <div id="page-current">
        <h2>Select Your Current Floor</h2>
        <p class="sub-title">(Pilih lantai anda terkini)</p>
        
        <div class="btn-row">
            <button class="btn" onclick="pilihTingkatSemasa(1)">1</button>
            <button class="btn" onclick="pilihTingkatSemasa(2)">2</button>
            <button class="btn" onclick="pilihTingkatSemasa(3)">3</button>
        </div>
    </div>

    <!-- HALAMAN 2: PILIH TINGKAT DESTINASI -->
    <div id="page-destination" class="hidden">
        <h2>Select Your Destination Floor</h2>
        <p class="sub-title">(Pilih anda ingin ke lantai berapa)</p>
        
        <div class="btn-row">
            <button class="btn" onclick="pilihTingkatDestinasi(1)">1</button>
            <button class="btn" onclick="pilihTingkatDestinasi(2)">2</button>
            <button class="btn" onclick="pilihTingkatDestinasi(3)">3</button>
        </div>
        
        <div id="alert-msg" class="message-alert hidden">You are already at this floor</div>
        <button class="btn-back" onclick="kembaliKeHalamanUtama()">◀ Kembali</button>
    </div>

    <!-- HALAMAN 3: SKRIN SELESAI -->
    <div id="page-success" class="hidden">
        <div class="message-success">Go to your destination...</div>
        <p style="color: #404040; font-size: 14px; margin-top: 10px;">Sistem sedang menggerakkan lif fizikal anda.</p>
        <button class="btn-back" onclick="resetSistemUntukUserBaru()" style="margin-top: 40px;">Pengguna Baharu</button>
    </div>
</div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBCFpNma5QPo0iQEHpVpHQ04Kk_Ki5M1q8",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebasedatabase.app",
    projectId: "smart-lift-touchless",
    storageBucket: "smart-lift-touchless.firebasestorage.app",
    messagingSenderId: "1014801320552",
    appId: "1:1014801320552:web:08f6e19041336b2c9a09dd",
    measurementId: "G-RR569DGJ5Y"
  };

  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  const pageCurrent = document.getElementById('page-current');
  const pageDestination = document.getElementById('page-destination');
  const pageSuccess = document.getElementById('page-success');
  const alertMsg = document.getElementById('alert-msg');
  const liftStatus = document.getElementById('lift-status');

  let selectedCurrentFloor = 0;

  // --- 1. PROSES SELEKSI TINGKAT SEMASA ---
  function pilihTingkatSemasa(tingkat) {
    selectedCurrentFloor = tingkat;
    
    // Alihkan skrin serta-merta secara melintang (GitHub style!)
    pageCurrent.classList.add('hidden');
    pageDestination.classList.remove('hidden');
    alertMsg.classList.add('hidden');
  }

  // --- 2. PROSES SELEKSI TINGKAT DESTINASI ---
  function pilihTingkatDestinasi(tingkatDestinasi) {
    // SEMAKAN KESELAMATAN: Jika destinasi SAMA dengan tingkat semasa berdiri
    if (tingkatDestinasi === selectedCurrentFloor) {
      alertMsg.classList.remove('hidden');
      return; 
    }

    // Hitung arah aliran untuk Modbus RTU PLC
    let arahPergerakan = "IDLE";
    if (tingkatDestinasi > selectedCurrentFloor) arahPergerakan = "NAIK";
    else if (tingkatDestinasi < selectedCurrentFloor) arahPergerakan = "TURUN";

    // Sorokkan butang, paparkan skrin kejayaan bersih "Go to your destination..."
    pageDestination.classList.add('hidden');
    liftStatus.classList.add('hidden');
    pageSuccess.classList.remove('hidden');

    // Suntik data secara latar belakang ke Firebase RTDB
    database.ref('CurrentFloor').set(selectedCurrentFloor);
    database.ref('TargetFloor').set(tingkatDestinasi);
    database.ref('Status').set(arahPergerakan);
  }

  function kembaliKeHalamanUtama() {
    pageDestination.classList.add('hidden');
    pageCurrent.classList.remove('hidden');
  }

  function resetSistemUntukUserBaru() {
    pageSuccess.classList.add('hidden');
    liftStatus.classList.remove('hidden');
    pageCurrent.classList.remove('hidden');
    selectedCurrentFloor = 0;
  }

  // Mengemas kini data kedudukan lif semasa dikesan PLC secara live
  database.ref('CurrentFloor').on('value', (snapshot) => {
    const data = snapshot.val();
    document.getElementById('current').innerText = data !== null ? data : 0;
  });
</script>

</body>
</html>
