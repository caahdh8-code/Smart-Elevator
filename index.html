<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Pintar Smart Lift</title>
    
    <!-- SDK Firebase CDN Klasik (Wajib untuk kestabilan penuh di GitHub Pages) -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <style>
        /* Reka bentuk tema satu warna minimalis profesional (Slate Grey) */
        body { font-family: 'Arial', sans-serif; text-align: center; background: #f4f5f7; color: #333; margin-top: 50px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); min-height: 350px; display: flex; flex-direction: column; justify-content: center; }
        h1 { font-size: 26px; color: #2c3e50; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        h3 { font-size: 20px; color: #495057; margin-top: 20px; }
        
        .btn { padding: 20px; width: 85%; margin: 12px auto; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 8px; border: 2px solid #495057; background: #495057; color: white; transition: 0.2s; display: block; }
        .btn:hover { background: #343a40; border-color: #343a40; }
        
        .status-box { font-size: 18px; margin-bottom: 25px; padding: 12px; background: #e9ecef; color: #495057; border-radius: 6px; font-weight: bold; border: 1px solid #ced4da; }
        .hidden { display: none !important; }
        .info-text { font-size: 14px; color: #6c757d; margin-bottom: 20px; }
        
        .message-success { font-size: 22px; font-weight: bold; color: #28a745; margin-top: 30px; }
        .message-alert { font-size: 16px; font-weight: bold; color: #dc3545; margin-top: 10px; }
        
        .btn-secondary { background: transparent; color: #6c757d; border: 2px solid #6c757d; font-size: 14px; padding: 10px; width: 40%; }
        .btn-secondary:hover { background: #e9ecef; color: #343a40; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Lift System</h1>
    
    <!-- Status kedudukan fizikal lif semasa dikesan PLC -->
    <div id="lift-status" class="status-box">Status Lif: Tingkat <span id="current">0</span></div>
    
    <!-- PERINGKAT 1: PILIH TINGKAT SEMASA USER -->
    <div id="page-current">
        <h3>Pilih Tingkat Semasa Anda</h3>
        <p class="info-text">(Di manakah anda sedang menunggu sekarang?)</p>
        <button class="btn" onclick="pilihTingkatSemasa(1)">TINGKAT 1</button>
        <button class="btn" onclick="pilihTingkatSemasa(2)">TINGKAT 2</button>
        <button class="btn" onclick="pilihTingkatSemasa(3)">TINGKAT 3</button>
    </div>

    <!-- PERINGKAT 2: PILIH TINGKAT DESTINASI -->
    <div id="page-destination" class="hidden">
        <h3>Pilih Tingkat Destinasi</h3>
        <p class="info-text">(Ke manakah arah tingkat yang ingin dituju?)</p>
        <button class="btn" id="dBtn1" onclick="pilihTingkatDestinasi(1)">TINGKAT 1</button>
        <button class="btn" id="dBtn2" onclick="pilihTingkatDestinasi(2)">TINGKAT 2</button>
        <button class="btn" id="dBtn3" onclick="pilihTingkatDestinasi(3)">TINGKAT 3</button>
        <div id="alert-msg" class="message-alert hidden">You are already at this floor</div>
        <br>
        <button class="btn btn-secondary" onclick="kembaliKeHalamanUtama()">◀ Kembali</button>
    </div>

    <!-- PERINGKAT 3: SKRIN SELESAI (GO TO YOUR DESTINATION) -->
    <div id="page-success" class="hidden">
        <div class="message-success">Go to your destination...</div>
        <p class="info-text" style="margin-top:20px;">Sistem sedang memproses pergerakan lif fizikal anda.</p>
        <button class="btn btn-secondary" onclick="resetSistemUntukUserBaru()" style="width:60%; margin-top:30px;">Pengguna Baharu</button>
    </div>
</div>

<script>
  // Rujukan konfigurasi pangkalan data projek anda
  const firebaseConfig = {
    apiKey: "AIzaSyBCFpNma5QPo0iQEHpVpHQ04Kk_Ki5M1q8",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebasedatabase.app",
    projectId: "smart-lift-touchless",
    storageBucket: "smart-lift-touchless.firebasestorage.app",
    messagingSenderId: "1014801320552",
    appId: "1:1014801320552:web:08f6e19041336b2c9a09dd",
    measurementId: "G-RR569DGJ5Y"
  };

  // Pemicu sistem Firebase
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  const pageCurrent = document.getElementById('page-current');
  const pageDestination = document.getElementById('page-destination');
  const pageSuccess = document.getElementById('page-success');
  const alertMsg = document.getElementById('alert-msg');
  const liftStatus = document.getElementById('lift-status');

  let selectedCurrentFloor = 0;

  // --- 1. ARAHAN SELEKSI TINGKAT SEMASA ---
  function pilihTingkatSemasa(tingkat) {
    selectedCurrentFloor = tingkat;
    
    // Tukar skrin visual serta-merta tanpa lag internet
    pageCurrent.classList.add('hidden');
    pageDestination.classList.remove('hidden');
    alertMsg.classList.add('hidden');

    // Paparkan semula semua butang destinasi
    document.getElementById('dBtn1').classList.remove('hidden');
    document.getElementById('dBtn2').classList.remove('hidden');
    document.getElementById('dBtn3').classList.remove('hidden');

    // LOGIK UTAMA: Sembunyikan butang destinasi yang SAMA dengan tingkat semasa user berdiri
    document.getElementById('dBtn' + tingkat).classList.add('hidden');
  }

  // --- 2. ARAHAN SELEKSI TINGKAT DESTINASI ---
  function pilihTingkatDestinasi(tingkatDestinasi) {
    if (tingkatDestinasi === selectedCurrentFloor) {
      alertMsg.classList.remove('hidden');
      return; 
    }

    // Hitung arah pergerakan automatik
    let arahPergerakan = "IDLE";
    if (tingkatDestinasi > selectedCurrentFloor) arahPergerakan = "NAIK";
    else if (tingkatDestinasi < selectedCurrentFloor) arahPergerakan = "TURUN";

    // Alihkan skrin serta-merta ke paparan penutup "Go to your destination..."
    pageDestination.classList.add('hidden');
    liftStatus.classList.add('hidden');
    pageSuccess.classList.remove('hidden');

    // Hantar data secara latar belakang ke Firebase Cloud
    database.ref('CurrentFloor').set(selectedCurrentFloor);
    database.ref('TargetFloor').set(tingkatDestinasi);
    database.ref('Status').set(arahPergerakan);
  }

  function kembaliKeHalamanUtama() {
    pageDestination.classList.add('hidden');
    pageCurrent.classList.remove('hidden');
  }

  function resetSistemUntukUserBaru() {
    pageSuccess.classList.add('hidden');
    liftStatus.classList.remove('hidden');
    pageCurrent.classList.remove('hidden');
    selectedCurrentFloor = 0;
  }

  // Membaca status lokasi lif fizikal semasa dikesan oleh PLC secara live
  database.ref('CurrentFloor').on('value', (snapshot) => {
    const data = snapshot.val();
    document.getElementById('current').innerText = data !== null ? data : 0;
  });
</script>

</body>
</html>
